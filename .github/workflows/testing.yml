name: Test React App
on: push
jobs:
  tests:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: ./my-app # Говорим гитхабу выполнять все команды внутри my-app
    steps:
      - name: Get repository code
        uses: actions/checkout@v4 # Обновил до актуальной версии v4

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm run test